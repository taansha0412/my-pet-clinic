<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paws and Care Clinic</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1><a href="#" data-go="home">Paws and Care</a></h1>
    <div id="session"></div>
  </header>

  <p id="msg" role="status"></p>

  <main>
    <!-- Home: choose who you are -->
    <section id="view-home">
      <h2>Welcome to Paws and Care</h2>
      <p>Choose how you want to continue.</p>
      <div class="choices">
        <button class="choice" data-go="owner"><strong>Pet owner</strong><span>Register your pet and get a visit time</span></button>
        <button class="choice alt" data-go="vet"><strong>Vet</strong><span>Log in and manage waiting pets</span></button>
      </div>
    </section>

    <!-- Pet owner -->
    <section id="view-owner" hidden>
      <div class="panel">
        <h2>Register your pet</h2>
        <form id="pet-form">
          <label>Pet name <input name="pet_name" required maxlength="100"></label>
          <label>Owner name <input name="owner_name" required maxlength="100"></label>
          <button type="submit">Register</button>
        </form>
      </div>

      <div class="panel">
        <h2>Check your pet</h2>
        <form id="status-form" class="inline">
          <label>Pet ID <input name="id" type="number" min="1" required></label>
          <button type="submit">Check</button>
        </form>
        <div id="status-card" hidden></div>
      </div>
      <button class="link" data-go="home">Back to home</button>
    </section>

    <!-- Vet login -->
    <section id="view-vet" hidden>
      <div class="panel narrow">
        <h2>Vet login</h2>
        <form id="login-form">
          <label>Name <input name="name" required autocomplete="username"></label>
          <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
          <button type="submit">Log in</button>
        </form>
      </div>
      <button class="link" data-go="home">Back to home</button>
    </section>

    <!-- Vet dashboard -->
    <section id="view-dash" hidden>
      <div class="panel">
        <h2>Waiting for a time</h2>
        <ul id="pending" class="plain"></ul>
      </div>
      <div class="panel">
        <h2>Approved</h2>
        <ul id="approved" class="plain"></ul>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
