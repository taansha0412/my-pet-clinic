<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paws and Care Clinic</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Paws and Care</h1>
    <div id="session"></div>
  </header>

  <p id="msg" role="status"></p>

  <main>
    <section class="intro">
      <h2>Care for your pet, booked in a minute</h2>
      <p>Open Monday to Saturday, 9 am to 7 pm. Register, add your pet and pick a vet and a time.</p>
      <h3>Our vets</h3>
      <ul id="vets" class="plain"></ul>
    </section>

    <section id="guest" class="panel">
      <h2>Log in or register</h2>
      <form id="login-form">
        <label>Email <input name="email" type="email" required></label>
        <label>Password <input name="password" type="password" required></label>
        <button type="submit">Log in</button>
      </form>
      <hr>
      <form id="register-form">
        <label>Your name <input name="name" required></label>
        <label>Email <input name="email" type="email" required></label>
        <label>Password (6+ characters) <input name="password" type="password" minlength="6" required></label>
        <button type="submit" class="alt">Create account</button>
      </form>
    </section>

    <div id="member" hidden>
      <section class="panel">
        <h2>My pets</h2>
        <ul id="pets" class="plain"></ul>
        <form id="pet-form">
          <label>Pet name <input name="name" required></label>
          <label>Species <input name="species" placeholder="Dog, cat, rabbit" required></label>
          <label>Breed <input name="breed"></label>
          <label>Age in years <input name="age" type="number" min="0" max="40"></label>
          <button type="submit">Add pet</button>
        </form>
      </section>

      <section class="panel">
        <h2>Book an appointment</h2>
        <form id="appt-form">
          <label>Pet <select name="pet_id" id="pet-select" required></select></label>
          <label>Vet <select name="vet_id" id="vet-select" required></select></label>
          <label>Date and time <input name="appt_time" type="datetime-local" required></label>
          <label>Reason <input name="reason" placeholder="Vaccination, limping, checkup"></label>
          <button type="submit">Book appointment</button>
        </form>
        <h3>Upcoming visits</h3>
        <ul id="appts" class="plain"></ul>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
